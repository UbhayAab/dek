apply plugin: 'com.android.application'

// Release signing reads the environment only; no secret ever sits in this repo.
//   DEK_ANDROID_KEYSTORE_PATH      default E:/secrets/dek/upload-keystore.jks
//   DEK_ANDROID_KEYSTORE_PASSWORD  required for release builds (repo .env.local)
//   DEK_ANDROID_KEY_ALIAS          default dek-upload
//   DEK_ANDROID_KEY_PASSWORD       default: the keystore password (PKCS12)
// scripts/android-build.mjs loads them from .env.local without printing them.
def dekKeystorePath = System.getenv('DEK_ANDROID_KEYSTORE_PATH') ?: 'E:/secrets/dek/upload-keystore.jks'
def dekKeystorePassword = System.getenv('DEK_ANDROID_KEYSTORE_PASSWORD')
def dekKeyAlias = System.getenv('DEK_ANDROID_KEY_ALIAS') ?: 'dek-upload'
def dekKeyPassword = System.getenv('DEK_ANDROID_KEY_PASSWORD') ?: dekKeystorePassword
def dekCanSignRelease = dekKeystorePassword != null && !dekKeystorePassword.isEmpty() && file(dekKeystorePath).exists()

android {
    namespace = "org.jaruratcare.dek"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        // PROPOSED id (decision D02 / APPQ01). Changeable until the first store upload.
        applicationId "org.jaruratcare.dek"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Play needs a strictly increasing versionCode on every upload.
        versionCode 2
        versionName "2.0.1"
        aaptOptions {
            // Files and dirs to omit from the packaged assets dir (dot files such as
            // .well-known stay out of the app).
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (dekCanSignRelease) {
            release {
                storeFile file(dekKeystorePath)
                storePassword dekKeystorePassword
                keyAlias dekKeyAlias
                keyPassword dekKeyPassword
            }
        }
    }
    buildTypes {
        release {
            // R8 stays off for the first release: Capacitor finds plugin methods by
            // reflection, and a stripped method fails only at run time.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (dekCanSignRelease) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// A release build without the upload key must fail loudly, never fall back to an
// unsigned or debug-signed bundle.
gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { t ->
        t.project == project && (t.name == 'bundleRelease' || t.name == 'assembleRelease')
    }
    if (wantsRelease && !dekCanSignRelease) {
        throw new GradleException(
            "Release signing needs DEK_ANDROID_KEYSTORE_PASSWORD and the upload keystore at " +
            dekKeystorePath + ". Run: node scripts/android-build.mjs release (see docs/NATIVE.md).")
    }
}

// Android push needs Firebase. Without google-services.json the app still builds
// and runs; DekNativePlugin reports pushConfigured=false and the web layer shows
// "Push not configured on this build" instead of calling FCM (DEK19).
// The file is gitignored; scripts/android-build.mjs copies it from
// DEK_GOOGLE_SERVICES_JSON or E:/secrets/dek/google-services.json when present.
def servicesJSON = file('google-services.json')
if (servicesJSON.exists() && servicesJSON.text.trim()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.lifecycle("Dek: google-services.json not found; building without Firebase (push not configured on this build).")
}

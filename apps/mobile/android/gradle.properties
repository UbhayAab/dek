# Dek Android build settings.
#
# The build machine is shared with other heavy jobs: keep one Gradle JVM, no
# daemon left running afterwards, and at most two workers. GRADLE_USER_HOME is set
# by scripts/android-build.mjs (E:\gradle-home) so caches stay off the C: drive.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=false

# AndroidX package structure.
android.useAndroidX=true

# Never put signing passwords here: release signing reads environment variables
# only (see app/build.gradle and docs/NATIVE.md).
